<title>Masihullahi Zunnurain – Digital Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#0b0c0e;--fg:#f3efe7;--muted:#a39e93;--card:#15161a;--line:#26272c;--gold:#d2b277;--gold2:#a98a52;--ink:#14110a;--glass:rgba(255,255,255,.06);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#ece6da;--fg:#1c1a16;--muted:#6f685b;--card:#fbf8f2;--line:#e0d8c8;--gold:#8f6f33;--gold2:#6f5524;--ink:#fff;--glass:rgba(0,0,0,.05)}}
:root[data-theme="light"]{--bg:#ece6da;--fg:#1c1a16;--muted:#6f685b;--card:#fbf8f2;--line:#e0d8c8;--gold:#8f6f33;--gold2:#6f5524;--ink:#fff;--glass:rgba(0,0,0,.05)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding:14px}
main{max-width:420px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:30px;overflow:hidden;position:relative}
.hero{position:relative;height:250px}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,0) 40%,var(--card) 100%)}
.tag{position:absolute;top:16px;right:16px;z-index:2;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);padding:6px 10px;border-radius:99px}
.av{position:relative;z-index:3;width:116px;height:116px;border-radius:50%;margin:-64px 0 0 22px;padding:3px;background:conic-gradient(from 200deg,var(--gold),var(--gold2),var(--gold))}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid var(--card);display:block}
.body{padding:14px 22px 24px}
h1{font-family:Fraunces,Georgia,"Times New Roman",serif;font-weight:600;font-size:30px;line-height:1.08;margin:0;letter-spacing:-.01em}
.role{margin:10px 0 0;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
.org{margin:6px 0 0;font-size:14px;color:var(--muted)}
.rule{height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:18px 0;opacity:.7}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.acts a{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 4px;border-radius:18px;background:var(--glass);border:1px solid var(--line);color:var(--fg);text-decoration:none;font-size:12px;font-weight:500}
.ic{width:20px;height:20px;fill:none;stroke:var(--gold);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rows{margin-top:14px}
.row{display:flex;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.row i{width:38px;height:38px;border-radius:12px;background:var(--glass);display:flex;align-items:center;justify-content:center;flex:none}
.row small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.row span{font-size:15px;word-break:break-all}
.save{display:block;text-align:center;margin-top:20px;padding:15px;border-radius:16px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--ink);text-decoration:none;font-weight:600;font-size:15px;letter-spacing:.02em}
.qrbox{margin-top:18px;display:flex;align-items:center;gap:16px;padding:14px;border-radius:20px;background:var(--glass);border:1px solid var(--line)}
.qrbox .q{background:#fff;padding:8px;border-radius:12px;width:112px;height:112px;flex:none;display:flex;align-items:center;justify-content:center}
.qrbox .q svg{width:100%;height:100%}
.qrbox p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.qrbox b{display:block;color:var(--fg);font-family:Fraunces,Georgia,serif;font-size:17px;margin-bottom:2px;font-weight:500}
.q small{font-size:10px;color:#777;text-align:center}
</style>
</head>
