<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masihullahi Zunnurain – Digital Card</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#eef1ee;--fg:#16201b;--muted:#5b6a62;--card:#fff;--line:#dbe2dd;--accent:#1e6b45;--accent-fg:#fff;--chip:#e6f1ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101513;--fg:#eaf1ed;--muted:#9fb0a6;--card:#1a211e;--line:#2a342f;--accent:#4fbf88;--accent-fg:#08140d;--chip:#223029}}
:root[data-theme="dark"]{--bg:#101513;--fg:#eaf1ed;--muted:#9fb0a6;--card:#1a211e;--line:#2a342f;--accent:#4fbf88;--accent-fg:#08140d;--chip:#223029}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
main{max-width:420px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.top{background:var(--accent);height:92px}
.av{width:92px;height:92px;border-radius:50%;background:var(--card);border:4px solid var(--card);margin:-46px auto 0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.body{padding:12px 20px 22px;text-align:center}
h1{font-size:22px;margin:8px 0 2px}
.role{font-size:15px;margin:0;color:var(--fg)}
.org{font-size:14px;color:var(--muted);margin:2px 0 0}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}
.acts a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;background:var(--chip);color:var(--accent);text-decoration:none;font-size:12px;font-weight:600}
.acts svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rows{text-align:left;border-top:1px solid var(--line)}
.row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center;color:inherit;text-decoration:none}
.row small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.row span{font-size:15px;word-break:break-all}
.save{display:block;margin-top:16px;padding:13px;border-radius:14px;background:var(--accent);color:var(--accent-fg);text-decoration:none;font-weight:700;font-size:15px}
.qrbox{margin-top:16px;text-align:center}
.qrbox .q{background:#fff;display:inline-block;padding:10px;border-radius:12px;border:1px solid var(--line)}
.qrbox .q svg{width:150px;height:150px}
.qrbox p{font-size:12px;color:var(--muted);margin:8px 0 0}
</style>
</head>
<body>
<main>
<div class="card">
<div class="top"></div>
<div class="av">MZ</div>
<div class="body">

<div class="acts">

<a href="https://wa.me/8801626252323"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-12.5 7.3L3 20.5l1.7-5.3A8.5 8.5 0 1 1 21 11.5z"/></svg>WhatsApp</a>
<a href="mailto:zunnurain.mis@palmalgarments.com"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Email</a>
<a href="https://www.palmalgroup.com"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>Website</a>
</div>
<div class="rows">
<a class="row" href="tel:+8801626252323"><div><small>Mobile</small><span>+880 1626-252323</span></div></a>
<a class="row" href="mailto:zunnurain.mis@palmalgarments.com"><div><small>Email</small><span>zunnurain.mis@palmalgarments.com</span></div></a>
<a class="row" href="https://www.palmalgroup.com"><div><small>Website</small><span>www.palmalgroup.com</span></div></a>

</main>
<script>

document.getElementById("qrbox").hidden=false;}catch(e){}}
</script>
</body>
</html>
